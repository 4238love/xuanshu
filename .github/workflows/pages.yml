name: Deploy Pages

# 把 Next.js 静态导出（out/）发布到 GitHub Pages
# 前置：仓库 Settings → Pages → Source 选择 "GitHub Actions"（本工作流会尝试自动开启）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免并发推送互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 读取 Pages 配置
        id: pages
        uses: actions/configure-pages@v5
        with:
          # 首次运行时尝试自动开启 Pages（需要工作流具备 pages: write 权限）
          enablement: true

      - name: 静态导出
        run: npm run build:pages
        env:
          # 项目页部署在 /<repo>/ 下，basePath 由上面的步骤算出
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
